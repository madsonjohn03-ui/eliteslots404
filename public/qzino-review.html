<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090711">
  <title>QZino Review | EliteSlots404</title>
  <meta name="description" content="Find the current QZino listing and review details in the EliteSlots404 casino directory. 18+ only.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#090711;--line:rgba(255,255,255,.09);--gold:#efbd68;--gold2:#ffdb8a;--white:#f8f6fb;--muted:#aaa3b8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% -10%,rgba(126,79,194,.2),transparent 42%),var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .card{width:min(560px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),#151121;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.35)}
    .mark{width:54px;height:54px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#f4cf8e,#9e6b34);color:#17101c;font-size:29px}
    .eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.18em}
    h1{margin:12px 0;font-size:30px;letter-spacing:-.05em}
    p{color:var(--muted);font-size:13px;line-height:1.8}
    a{display:inline-flex;margin-top:15px;padding:13px 20px;border-radius:10px;background:linear-gradient(110deg,#f6d69e,#d6a15c);color:#211728;text-decoration:none;font-size:12px;font-weight:900}
    #status{min-height:24px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">♛</div>
    <div class="eyebrow">ELITESLOTS404 · CASINO DIRECTORY</div>
    <h1>QZino review</h1>
    <p id="status">Looking for the current QZino listing…</p>
    <a id="home" href="/">Return to casino directory</a>
  </main>
  <script>
    (async function(){
      const status=document.getElementById("status");
      try{
        const response=await fetch("/api/casinos");
        if(!response.ok) throw new Error("Could not load listings");
        const casinos=await response.json();
        const qzino=Array.isArray(casinos)?casinos.find(item=>String(item.name||"").trim().toLowerCase()==="qzino"):null;
        if(qzino && qzino.slug){
          status.textContent="The current listing was found. Opening the latest review…";
          window.location.replace("/casino/"+encodeURIComponent(qzino.slug));
          return;
        }
        status.textContent="The current QZino listing is not available in the directory. Please check the latest casino listings.";
      }catch(error){
        status.textContent="We could not load the current review right now. Please return to the casino directory.";
      }
    })();
  </script>
</body>
</html>
